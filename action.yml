name: 'size-limit-action'
description: 'size-limit action'
author: 'Andres Alvarez <a.alvarez.sor@gmail.com>'
branding:
  icon: 'activity'
  color: 'green'
inputs:
  github_token:
    required: true
    description: 'a github access token'
  build_script:
    required: false
    description: 'a custom npm script to build'
  clean_script:
    required: false
    description: 'a npm script to clean up build directory'
  skip_step:
    required: false
    description: 'which step to skip, either "install" or "build"'
  directory:
    required: false
    description: "a custom subdirectory"
  windows_verbatim_arguments:
    required: false
    description: "exec `size-limit` with the option `windowsVerbatimArguments`"
    default: true
  script:
    required: false
    default: "npx size-limit --json"
    description: "The script used to generate size-limit results"
  package_manager:
    required: false
    description: "The package manager used to run the build and install commands. If not provided, the manager will be auto detected. Example values: `yarn`, `npm`, `pnpm`, `bun`."
  use_artifacts:
    required: false
    default: false
    description: "read the base branch results from a workflow artifact instead of building the base branch. Requires a run of this action on the main branch to produce that artifact, and `actions: read` permission. On the main branch, also reuses the merged pull request's own result instead of rebuilding when nothing relevant changed since; this additionally requires `pull-requests: read` permission on that workflow. Falls back to building the base branch, or to a full main branch build, when there is nothing usable to reuse."
  main_branch:
    required: false
    description: "the branch that produces the results artifact. Defaults to the repository default branch. Only used when `use_artifacts` is enabled."
  artifact_name:
    required: false
    default: "size-limit-results"
    description: "the name of the workflow artifact holding the base branch results. Only used when `use_artifacts` is enabled, and only needs changing when a repository runs this action more than once."
runs:
  using: 'node20'
  main: 'dist/index.js'
